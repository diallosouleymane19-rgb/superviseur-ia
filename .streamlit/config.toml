# Charte KontrolIA « Graphite & Cuivre » : graphite #1F2933, cuivre #A9592A.
# Polices hébergées sur le serveur (static/fonts, et Source Serif intégrée à Streamlit) : aucun appel à Google Fonts (RGPD).

[server]
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#1F2933"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F3F0"
textColor = "#1F2933"
linkColor = "#8F4A22"
borderColor = "#E2E5E9"
baseRadius = "6px"
font = "IBM Plex Sans, sans-serif"
headingFont = "serif"
baseFontSize = 15

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-600-normal.woff2"
weight = 600

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#1F2933"
primaryColor = "#A9592A"
borderColor = "#E2E5E9"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
