# Superviseur IA Comptable — serveur OVH (France)
#   db       : base PostgreSQL, jamais exposée sur Internet
#   app      : application Streamlit
#   webhook  : réception des paiements Stripe (https://DOMAINE/webhook/stripe)
#   caddy    : HTTPS automatique (certificat Let's Encrypt), seul service ouvert sur Internet
# Les mots de passe sont dans deploy/.env et deploy/secrets.toml (créés par installer.sh, jamais sur GitHub).

name: superviseur

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smd
      POSTGRES_USER: smd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe de la base manquant dans deploy/.env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smd -d smd"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: superviseur-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://smd:${POSTGRES_PASSWORD}@db:5432/smd
    volumes:
      - ./secrets.toml:/app/.streamlit/secrets.toml:ro
    depends_on:
      db:
        condition: service_healthy

  webhook:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: superviseur-app
    restart: unless-stopped
    command: ["uvicorn", "webhook_stripe:app", "--host", "0.0.0.0", "--port", "4242"]
    environment:
      DATABASE_URL: postgresql://smd:${POSTGRES_PASSWORD}@db:5432/smd
    volumes:
      - ./secrets.toml:/app/.streamlit/secrets.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4242/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAINE: ${DOMAINE:?domaine manquant dans deploy/.env}
      EMAIL_CERTIFICAT: ${EMAIL_CERTIFICAT:?e-mail du certificat manquant dans deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
